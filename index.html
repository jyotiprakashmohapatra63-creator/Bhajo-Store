<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Soft RGB Mobile Keyboard UI</title>
    <style>
        /* Transparent body so only the keyboard background is visible */
        body {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        /* Keyboard Wrapper engineered to fit 1080x1920 UI effortlessly */
        .keyboard-wrapper {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            position: relative;
            transition: transform 0.3s ease;
            box-sizing: border-box;
        }

        /* Professional Toggle Icon */
        .keyboard-toggle-icon {
            background-color: #161c2d;
            color: #a855f7;
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-bottom: none;
            width: 38px;
            height: 26px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            cursor: pointer;
            margin-right: 16px;
            user-select: none;
            transition: all 0.2s ease;
            box-shadow: 0 0 6px rgba(168, 85, 247, 0.2);
        }

        .keyboard-toggle-icon:hover {
            background-color: #1f293d;
            color: #ffffff;
        }

        /* Keyboard Container */
        .keyboard {
            width: 100%;
            background-color: #141a29;
            padding: 16px 12px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0px -8px 30px rgba(0, 0, 0, 0.6);
            border-top: 1.5px solid rgba(168, 85, 247, 0.4);
            user-select: none;
            box-sizing: border-box;
        }

        .keyboard-wrapper.minimized .keyboard {
            display: none;
        }

        /* Keyboard Rows */
        .keyboard-row {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
            gap: 6px;
        }

        /* Base Keyboard Keys Style */
        .key {
            background-color: #1b2234;
            font-size: 17px;
            font-weight: 500;
            flex: 1;
            height: 52px;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.15s ease;
        }

        .key:active {
            transform: scale(0.96);
        }

        /* --- UNIVERSAL ROTATING BORDER ANIMATION FOR ALL REGULAR KEYS --- */
        @keyframes softBorderRotate {
            0% {
                border-color: rgba(56, 189, 248, 0.55);
                box-shadow: 0 0 7px rgba(56, 189, 248, 0.28);
            }
            33% {
                border-color: rgba(74, 222, 128, 0.55);
                box-shadow: 0 0 7px rgba(74, 222, 128, 0.28);
            }
            66% {
                border-color: rgba(251, 191, 36, 0.55);
                box-shadow: 0 0 7px rgba(251, 191, 36, 0.28);
            }
            100% {
                border-color: rgba(56, 189, 248, 0.55);
                box-shadow: 0 0 7px rgba(56, 189, 248, 0.28);
            }
        }

        /* Applying the universal rotating animation to ALL standard keys across layouts (Alphabet, Symbols, Numbers) */
        #alphabet-layout .key:not(.special),
        #symbol-layout .key:not(.special),
        #number-pad-view .key:not(.special) {
            border: 1.5px solid rgba(56, 189, 248, 0.55);
            animation: softBorderRotate 4s linear infinite;
        }

        /* --- TEXT COLORS & SUBTLE GLOW FOR ALPHABETS --- */
        #alphabet-layout .keyboard-row:nth-child(1) .key:not(.special) {
            color: #38bdf8;
            text-shadow: 0 0 4px rgba(56, 189, 248, 0.3);
        }
        #alphabet-layout .keyboard-row:nth-child(1) .key:not(.special):active {
            background-color: #38bdf8;
            color: #121622;
        }

        #alphabet-layout .keyboard-row:nth-child(2) .key:not(.special) {
            color: #4ade80;
            text-shadow: 0 0 4px rgba(74, 222, 128, 0.3);
        }
        #alphabet-layout .keyboard-row:nth-child(2) .key:not(.special):active {
            background-color: #4ade80;
            color: #121622;
        }

        #alphabet-layout .keyboard-row:nth-child(3) .key:not(.special) {
            color: #fbbf24;
            text-shadow: 0 0 4px rgba(251, 191, 36, 0.3);
        }
        #alphabet-layout .keyboard-row:nth-child(3) .key:not(.special):active {
            background-color: #fbbf24;
            color: #121622;
        }

        /* --- MATCHED ROW-WISE MULTI-COLOR STYLING FOR SYMBOLS & NUMBERS --- */
        /* Row 1 of Symbols */
        #symbol-layout #symbols-view .keyboard-row:nth-child(1) .key:not(.special) {
            color: #38bdf8;
            text-shadow: 0 0 4px rgba(56, 189, 248, 0.3);
        }
        #symbol-layout #symbols-view .keyboard-row:nth-child(1) .key:not(.special):active {
            background-color: #38bdf8;
            color: #121622;
        }

        /* Row 2 of Symbols */
        #symbol-layout #symbols-view .keyboard-row:nth-child(2) .key:not(.special) {
            color: #4ade80;
            text-shadow: 0 0 4px rgba(74, 222, 128, 0.3);
        }
        #symbol-layout #symbols-view .keyboard-row:nth-child(2) .key:not(.special):active {
            background-color: #4ade80;
            color: #121622;
        }

        /* Row 3 of Symbols */
        #symbol-layout #symbols-view .keyboard-row:nth-child(3) .key:not(.special) {
            color: #fbbf24;
            text-shadow: 0 0 4px rgba(251, 191, 36, 0.3);
        }
        #symbol-layout #symbols-view .keyboard-row:nth-child(3) .key:not(.special):active {
            background-color: #fbbf24;
            color: #121622;
        }

        /* Row 4 of Symbols (Extra symbol keys) */
        #symbol-layout #symbols-view .keyboard-row:nth-child(4) .key:not(.special) {
            color: #f472b6;
            text-shadow: 0 0 4px rgba(244, 114, 182, 0.3);
        }
        #symbol-layout #symbols-view .keyboard-row:nth-child(4) .key:not(.special):active {
            background-color: #f472b6;
            color: #121622;
        }

        /* Number pad layout standard keys text coloring matching alphabet row distribution */
        #number-pad-view .keyboard-row:nth-child(1) .key:not(.special) {
            color: #38bdf8;
            text-shadow: 0 0 4px rgba(56, 189, 248, 0.3);
        }
        #number-pad-view .keyboard-row:nth-child(2) .key:not(.special) {
            color: #4ade80;
            text-shadow: 0 0 4px rgba(74, 222, 128, 0.3);
        }
        #number-pad-view .keyboard-row:nth-child(3) .key:not(.special) {
            color: #fbbf24;
            text-shadow: 0 0 4px rgba(251, 191, 36, 0.3);
        }
        #number-pad-view .keyboard-row:nth-child(4) .key:not(.special) {
            color: #f472b6;
            text-shadow: 0 0 4px rgba(244, 114, 182, 0.3);
        }
        #number-pad-view .key:not(.special):active {
            background-color: #38bdf8;
            color: #121622;
        }

        /* Special Keys */
        .key.special {
            background-color: #231c33;
            color: #f472b6;
            font-size: 15px;
            flex: 1.5;
            border: 1px solid rgba(244, 114, 182, 0.35);
            text-shadow: 0 0 4px rgba(244, 114, 182, 0.3);
        }

        .key.special:active {
            background-color: #f472b6;
            color: #121622;
        }

        /* Spacebar */
        .key.spacebar {
            flex: 5;
            background-color: #1f1b36;
            color: #c084fc;
            border: 1px solid rgba(192, 132, 252, 0.35);
            text-shadow: 0 0 5px rgba(192, 132, 252, 0.35);
        }

        .key.spacebar:active {
            background-color: #c084fc;
            color: #121622;
        }

        /* Comma and Period Keys Styling */
        .key.punct {
            background-color: #1b2234;
            color: #38bdf8;
            border: 1.5px solid rgba(56, 189, 248, 0.55);
            box-shadow: 0 0 7px rgba(56, 189, 248, 0.28);
            text-shadow: 0 0 4px rgba(56, 189, 248, 0.3);
        }
        .key.punct:active {
            background-color: #38bdf8;
            color: #121622;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="keyboard-wrapper" id="keyboard-wrapper">
        <div class="keyboard-toggle-icon" id="hide-show-icon">▼</div>
        
        <div class="keyboard" id="main-keyboard">
            <div id="alphabet-layout">
                <div class="keyboard-row">
                    <button class="key">q</button>
                    <button class="key">w</button>
                    <button class="key">e</button>
                    <button class="key">r</button>
                    <button class="key">t</button>
                    <button class="key">y</button>
                    <button class="key">u</button>
                    <button class="key">i</button>
                    <button class="key">o</button>
                    <button class="key">p</button>
                </div>

                <div class="keyboard-row">
                    <button class="key">a</button>
                    <button class="key">s</button>
                    <button class="key">d</button>
                    <button class="key">f</button>
                    <button class="key">g</button>
                    <button class="key">h</button>
                    <button class="key">j</button>
                    <button class="key">k</button>
                    <button class="key">l</button>
                </div>

                <div class="keyboard-row">
                    <button class="key special" id="shift-btn">⇧</button>
                    <button class="key">z</button>
                    <button class="key">x</button>
                    <button class="key">c</button>
                    <button class="key">v</button>
                    <button class="key">b</button>
                    <button class="key">n</button>
                    <button class="key">m</button>
                    <button class="key special">⌫</button>
                </div>
            </div>

            <div id="symbol-layout" class="hidden">
                <div id="symbols-view">
                    <div class="keyboard-row">
                        <button class="key">~</button>
                        <button class="key">`</button>
                        <button class="key">|</button>
                        <button class="key">•</button>
                        <button class="key">√</button>
                        <button class="key">π</button>
                        <button class="key">÷</button>
                        <button class="key">×</button>
                        <button class="key">¶</button>
                        <button class="key">∆</button>
                    </div>

                    <div class="keyboard-row">
                        <button class="key">@</button>
                        <button class="key">#</button>
                        <button class="key">$</button>
                        <button class="key">%</button>
                        <button class="key">&</button>
                        <button class="key">-</button>
                        <button class="key">_</button>
                        <button class="key">+</button>
                        <button class="key">=</button>
                        <button class="key">(</button>
                    </div>

                    <div class="keyboard-row">
                        <button class="key">)</button>
                        <button class="key">!</button>
                        <button class="key">?</button>
                        <button class="key">:</button>
                        <button class="key">;</button>
                        <button class="key">"</button>
                        <button class="key">'</button>
                        <button class="key">/</button>
                        <button class="key">\</button>
                    </div>

                    <div class="keyboard-row">
                        <button class="key special" id="num-pad-toggle">123</button>
                        <button class="key">&lt;</button>
                        <button class="key">&gt;</button>
                        <button class="key">[</button>
                        <button class="key">]</button>
                        <button class="key">{</button>
                        <button class="key">}</button>
                        <button class="key special">⌫</button>
                    </div>
                </div>

                <div id="number-pad-view" class="hidden">
                    <div class="keyboard-row">
                        <button class="key">7</button>
                        <button class="key">8</button>
                        <button class="key">9</button>
                    </div>
                    <div class="keyboard-row">
                        <button class="key">4</button>
                        <button class="key">5</button>
                        <button class="key">6</button>
                    </div>
                    <div class="keyboard-row">
                        <button class="key">1</button>
                        <button class="key">2</button>
                        <button class="key">3</button>
                    </div>
                    <div class="keyboard-row">
                        <button class="key special" id="back-to-symbols">#+=</button>
                        <button class="key">0</button>
                        <button class="key special">⌫</button>
                    </div>
                </div>
            </div>

            <div class="keyboard-row" style="margin-top: 10px;">
                <button class="key special" id="toggle-btn">?123</button>
                <button class="key punct">,</button>
                <button class="key spacebar">space</button>
                <button class="key punct">.</button>
                <button class="key special">↵</button>
            </div>
        </div>
    </div>

    <script>
        const hideShowIcon = document.getElementById('hide-show-icon');
        const keyboardWrapper = document.getElementById('keyboard-wrapper');

        hideShowIcon.addEventListener('click', () => {
            keyboardWrapper.classList.toggle('minimized');
            if (keyboardWrapper.classList.contains('minimized')) {
                hideShowIcon.innerText = '▲'; 
            } else {
                hideShowIcon.innerText = '▼'; 
            }
        });

        const toggleBtn = document.getElementById('toggle-btn');
        const alphabetLayout = document.getElementById('alphabet-layout');
        const symbolLayout = document.getElementById('symbol-layout');
        
        const symbolsView = document.getElementById('symbols-view');
        const numberPadView = document.getElementById('number-pad-view');
        const numPadToggle = document.getElementById('num-pad-toggle');
        const backToSymbols = document.getElementById('back-to-symbols');

        toggleBtn.addEventListener('click', () => {
            alphabetLayout.classList.toggle('hidden');
            symbolLayout.classList.toggle('hidden');
            symbolsView.classList.remove('hidden');
            numberPadView.classList.add('hidden');
            numPadToggle.innerText = '123';
            
            toggleBtn.innerText = alphabetLayout.classList.contains('hidden') ? 'ABC' : '?123';
        });

        numPadToggle.addEventListener('click', () => {
            symbolsView.classList.add('hidden');
            numberPadView.classList.remove('hidden');
        });

        backToSymbols.addEventListener('click', () => {
            numberPadView.classList.add('hidden');
            symbolsView.classList.remove('hidden');
        });

        const shiftBtn = document.getElementById('shift-btn');
        const letterKeys = document.querySelectorAll('#alphabet-layout .key:not(.special)');
        
        let shiftState = 0; 
        let lastClickTime = 0;

        function updateKeyboardCase() {
            letterKeys.forEach(key => {
                let text = key.innerText;
                if (shiftState > 0) {
                    key.innerText = text.toUpperCase();
                } else {
                    key.innerText = text.toLowerCase();
                }
            });

            if (shiftState === 2) {
                shiftBtn.style.backgroundColor = '#f472b6'; 
                shiftBtn.style.color = '#121622';
                shiftBtn.innerText = '⇧⬆';
            } else if (shiftState === 1) {
                shiftBtn.style.backgroundColor = '#32233f'; 
                shiftBtn.style.color = '#f472b6';
                shiftBtn.innerText = '⇧';
            } else {
                shiftBtn.style.backgroundColor = '#231c33'; 
                shiftBtn.style.color = '#f472b6';
                shiftBtn.innerText = '⇧';
            }
        }

        shiftBtn.addEventListener('click', () => {
            const currentTime = new Date().getTime();
            const timeDifference = currentTime - lastClickTime;

            if (timeDifference < 300 && timeDifference > 0) {
                shiftState = 2;
            } else {
                if (shiftState === 0) {
                    shiftState = 1;
                } else if (shiftState === 1) {
                    shiftState = 0;
                } else if (shiftState === 2) {
                    shiftState = 0;
                }
            }
            lastClickTime = currentTime;
            updateKeyboardCase();
        });

        letterKeys.forEach(key => {
            key.addEventListener('click', () => {
                if (shiftState === 1) {
                    shiftState = 0;
                    setTimeout(updateKeyboardCase, 150);
                }
            });
        });
    </script>

</body>
</html>
